<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img"
     aria-label="Ilustrasi strategi gerilya Wehrkreise Jenderal Soedirman 1945-1949">
  <defs>
    <linearGradient id="ger-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <radialGradient id="ger-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="0.55" stop-color="#D4A017"/>
      <stop offset="1" stop-color="#B45309"/>
    </radialGradient>
    <linearGradient id="ger-hill-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="ger-hill-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ger-hill-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#080D18"/>
    </linearGradient>
  </defs>

  <rect width="320" height="400" rx="18" fill="url(#ger-sky)"/>

  <!-- sun -->
  <circle cx="228" cy="118" r="46" fill="url(#ger-sun)" opacity=".92"/>
  <circle cx="228" cy="118" r="70" fill="none" stroke="#D4A017" stroke-width="1.2" opacity=".3"/>
  <circle cx="228" cy="118" r="92" fill="none" stroke="#D4A017" stroke-width="1" opacity=".16"/>

  <!-- horizon mist -->
  <rect x="0" y="150" width="320" height="42" fill="#D4A017" opacity=".07"/>

  <!-- hills -->
  <path d="M0 214c52-30 96-8 140-26s84-40 180-16v228H0Z" fill="url(#ger-hill-far)" opacity=".85"/>
  <path d="M0 258c58-26 104-46 156-30s92 34 164 18v154H0Z" fill="url(#ger-hill-mid)"/>
  <path d="M0 306c70-24 118-40 168-24s96 30 152 20v98H0Z" fill="url(#ger-hill-near)"/>

  <!-- guerrilla network: wehrkreise pockets -->
  <g stroke="#10B981" stroke-width="1.8" opacity=".85" fill="none">
    <path d="M62 250 108 232 156 244 206 226 258 240"/>
  </g>
  <g>
    <circle cx="62" cy="250" r="5.5" fill="#10B981" stroke="#FAF7F2" stroke-width="1.4"/>
    <circle cx="108" cy="232" r="5.5" fill="#10B981" stroke="#FAF7F2" stroke-width="1.4"/>
    <circle cx="156" cy="244" r="5.5" fill="#10B981" stroke="#FAF7F2" stroke-width="1.4"/>
    <circle cx="206" cy="226" r="5.5" fill="#10B981" stroke="#FAF7F2" stroke-width="1.4"/>
    <circle cx="258" cy="240" r="5.5" fill="#10B981" stroke="#FAF7F2" stroke-width="1.4"/>
  </g>

  <!-- van mook fault line -->
  <path d="M186 96v190" stroke="#F59E0B" stroke-width="2.6" stroke-dasharray="7,6" opacity=".85"/>
  <text x="192" y="104" font-family="Georgia, serif" font-size="9" font-weight="700"
        fill="#FBBF24" letter-spacing="1">GARIS VAN MOOK</text>

  <!-- commander on the ridge -->
  <g transform="translate(96 214)">
    <!-- bamboo runcing -->
    <path d="M34 -34L46 -92" stroke="#D4A017" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M46 -92l5-14" stroke="#FBBF24" stroke-width="2.6" stroke-linecap="round"/>
    <!-- body -->
    <path d="M18 0c0-16 7-29 16-29s16 13 16 29Z" fill="#0B1120"/>
    <circle cx="34" cy="-38" r="10" fill="#0B1120"/>
    <!-- headgear -->
    <path d="M22 -42c0-8 6-13 12-13s12 5 12 13Z" fill="#B91C1C"/>
    <path d="M22 -42h24" stroke="#881313" stroke-width="1.6"/>
    <!-- arm holding the lance -->
    <path d="M42 -20 47 -34" stroke="#0B1120" stroke-width="6" stroke-linecap="round"/>
    <!-- legs -->
    <path d="M28 0v18M40 0v18" stroke="#0B1120" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- rice-terrace foreground -->
  <g stroke="#334155" stroke-width="1.2" opacity=".7" fill="none">
    <path d="M0 344c60-14 118-6 176-16s96-6 144 4"/>
    <path d="M0 366c66-12 126-4 184-14s92-4 136 4"/>
    <path d="M0 388c72-10 132-2 190-12s88-2 130 4"/>
  </g>

  <!-- caption strip -->
  <rect x="0" y="366" width="320" height="34" fill="#0B1120"/>
  <rect x="0" y="366" width="320" height="5" fill="#10B981"/>
  <text x="160" y="388" font-family="Georgia, serif" font-size="12" font-weight="700"
        fill="#FAF7F2" text-anchor="middle" letter-spacing="2">WEHRKREISE 1948</text>
</svg>